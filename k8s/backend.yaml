apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: task-api:latest
          imagePullPolicy: Never  # use local minikube image
          ports:
            - containerPort: 8080
          env:
            - name: MongoDB__ConnectionString
              value: "mongodb://mongo-svc:27017"
            - name: MongoDB__Database
              value: "taskdb"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
